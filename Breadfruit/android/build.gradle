// --- Fix for React Native Reanimated: ensure rootProject.ext.react exists ---
if (!rootProject.ext.has("react")) {
    rootProject.ext.react = [:]
}
if (!rootProject.ext.react.containsKey("version")) {
    rootProject.ext.react["version"] = "20.0.2"
}
if (!rootProject.ext.react.containsKey("minor")) {
    rootProject.ext.react["minor"] = 20
}
buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"//2.1.20
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
        classpath("com.google.gms:google-services:4.4.2")
    }
}
// Force correct Play Services versions for all subprojects
allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-location:20.0.0'
            force 'com.google.android.gms:play-services-base:18.2.0'
        }
    }
}

//apply plugin: "com.facebook.react.rootproject"
subprojects { subproject ->
    if (subproject.name == "tflite-react-native") {
        afterEvaluate {
            subproject.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}
// --- ✅ Force all modules to use the same NDK version ---
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android {
                ndkVersion = "26.1.10909125"
            }
        }
    }
}
// ---------------------------------------------------------

apply plugin: "com.facebook.react.rootproject"